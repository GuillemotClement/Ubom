<div class="text-center lg:text-left">
  <h1 class="text-5xl font-bold">Inscription</h1>
  <p class="py-6">
    Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi exercitationem
    quasi. In deleniti eaque aut repudiandae et a id nisi.
  </p>
</div>
<div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
    <div class="card-body">
        <fieldset class="fieldset">
            <label class="label">Email</label>
            <input type="email" class="input" placeholder="Email" />
            <label class="label">Password</label>
            <input type="password" class="input" placeholder="Password" />
            <div class="flex justify-between my-3">
              <button class="link link-hover">Forgot password?</button>
              <button class="link link-hover" (click)="goToRegister()">J'ai déjà un compte</button>
            </div>
            <button class="btn btn-neutral">Login</button>
        </fieldset>
    </div>
</div>
