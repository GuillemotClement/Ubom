#######################################
#     APPLICATION CONFIGURATION       #
#######################################

# Nom de l'application Spring Boot
spring.application.name=backend
# Chargement des variables d'envrionnement depuis le fichier .env
spring.config.import=file:.env[.properties]

# ---------------------------------------- #

#######################################
#     DATABASE CONFIG (JDBC/JPA)      #
#######################################

# URL de connexion DB
# Format: jdbc:postgresql://host:port/database
# utilisation des variables du fichier .env
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
# nom utilisateur pour la database
spring.datasource.username=${POSTGRES_USER}
# mot de passe utilisateur pour la database
spring.datasource.password=${POSTGRES_PASSWORD}

# ---------------------------------------------------#

#######################################
#     CONFIGURATION JPA / HIBERNATE   #
#######################################

# ddl-auto: validate 
# - validate: Hibernate vérifie que le schéma en DB correspond aux entité
# - Ne crée, ne modifie, ne supprime rien automatiquement
# - A utiliser avec Flyway (celui ci gère les migrations, Hibernate valide)
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=none
# affichage du SQL généré par Hibernate dans les logs
# false: utilisé pour la prod pour les perf
# spring.jpa.show-sql=true
spring.jpa.show-sql=false
# formate le SQL pour le rendre lisible dans les logs
spring.jpa.properties.hibernate.format_sql=true
# ajoute des commentaires au SQL généré
spring.jpa.properties.hibernate.use_sql_comments=true
# Permet à Flyway de s'exécuter AVANT la validation Hibernate
# spring.jpa.defer-datasource-initialization=true

#############################################################
#          CONFIGURATION FLYWAY (migration)                 #
#############################################################

# localisation des fichier de migrations SQL
# chemin relatif aux ressources: src/main/ressources/db/migration/
# Flyway recherche les fichiers de la forme: V{version}__{description}.sql
spring.flyway.locations=classpath:db/migration

# Baseline mode: crée une version de baseline pour une DB existante
# true: permet de démarrer Flyway sur une DB qui existe déjà
# false: la DB doit être vide
spring.flyway.baseline-on-migrate=true

# Debug Flyway détaillé
logging.level.org.flywaydb=DEBUG
logging.level.org.flywaydb.core=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

spring.jpa.defer-datasource-initialization=true
spring.flyway.init-sqls=
# spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

#############################################################
#          LOGGING CONFIGURATION                            #
#############################################################
# Niveau de log par défaut pour tous les loggers
# WARN = affiche seulement les avertissements et erreurs
# Réduit le bruit des logs en supprimant les INFO et DEBUG

# logging.level.org.flywaydb.core.internal.command=INFO

# logging.level.root=WARN
logging.level.root=WARN

# À décommenter pour plus de détails :
# logging.level.root=INFO (pour voir plus de logs)
# logging.level.org.hibernate.SQL=DEBUG (pour voir le SQL généré)
# logging.level.org.springframework.web=DEBUG (pour voir les requêtes HTTP)

#############################################################
#          NOTES                           #
#############################################################


# - Les variables ${POSTGRES_*} doivent être définie dans le fichier .env
# - Flyway gère les migrations de schéma (tables, colonnes, etc.)
# - Hibernate gère uniquement les mappings entité ↔ colonne
# - ddl-auto=validate vérifie que tout correspond
# - À chaque démarrage, Flyway exécute automatiquement les nouvelles migrations
